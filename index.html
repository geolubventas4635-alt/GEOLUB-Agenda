<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2C2B7E">
<title>GEOLUB Agenda</title>
<link rel="manifest" href="./manifest.json">
<style>
:root{--blue:#2C2B7E;--red:#9A1B1E;--ink:#17213b;--bg:#f3f6fb;--line:#dce3ef;--green:#18794e}
*{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;background:var(--bg);color:var(--ink)}
header{background:linear-gradient(110deg,#fff 0 31%,var(--blue) 31% 74%,var(--red) 74%);min-height:110px;display:flex;align-items:center;padding:14px 24px;box-shadow:0 4px 18px #0002}
header img{width:min(300px,42vw);max-height:80px;object-fit:contain;background:white;border-radius:12px;padding:6px}
header .title{margin-left:auto;color:white;text-align:right}.title h1{margin:0;font-size:clamp(24px,4vw,46px);letter-spacing:.06em}.title small{font-weight:700}
.wrap{max-width:1250px;margin:auto;padding:20px}.top{display:grid;grid-template-columns:1.1fr 1.9fr;gap:18px}
.card{background:white;border:1px solid var(--line);border-radius:18px;box-shadow:0 8px 24px #25365b12;padding:18px}
h2{margin:0 0 14px;color:var(--blue)} label{display:block;font-weight:800;font-size:13px;margin:11px 0 5px}
input,textarea,select{width:100%;padding:12px 13px;border:1px solid #cfd8e8;border-radius:10px;font:inherit;background:white}
textarea{min-height:82px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{border:0;border-radius:10px;padding:12px 16px;font-weight:850;cursor:pointer}.primary{background:var(--red);color:white;width:100%;margin-top:14px;font-size:16px}
.datebar{display:flex;gap:8px;align-items:center;margin-bottom:12px}.datebar input{max-width:210px}
.hours{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:10px 0 16px}
.hour{background:#eef2f8;color:var(--blue);border:2px solid transparent;padding:10px 5px}.hour b{display:block}.hour span{font-size:11px}.hour.sel{border-color:var(--red);background:#fff3f3}.hour.full{background:#f4dfe0;color:#7d2024;opacity:.75}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}.stat{padding:12px;border-radius:14px;background:#f6f8fc;text-align:center}.stat b{font-size:22px;color:var(--blue);display:block}
.item{border-left:5px solid var(--blue);padding:12px;margin:10px 0;background:#f8faff;border-radius:10px;display:grid;grid-template-columns:90px 1fr auto;gap:10px;align-items:center}.item .time{font-size:19px;font-weight:900;color:var(--blue)}.item strong{display:block}.meta{font-size:13px;color:#59657a}.actions{display:flex;gap:5px}.actions button{padding:7px 9px;background:#e8edf6}.actions .del{background:#f7e2e3;color:#8a1d22}
.empty{text-align:center;color:#6d778a;padding:30px 5px}.badge{display:inline-block;padding:3px 8px;border-radius:999px;background:#e3f4eb;color:var(--green);font-size:11px;font-weight:800}
@media(max-width:800px){header{min-height:92px;padding:10px 12px}.title small{display:none}.wrap{padding:10px}.top{grid-template-columns:1fr}.hours{grid-template-columns:repeat(2,1fr)}.row{grid-template-columns:1fr}.item{grid-template-columns:70px 1fr}.actions{grid-column:2}.stats{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<header><img src="./geolub-logo.png" alt="GEOLUB"><div class="title"><h1>AGENDA</h1><small>Servicio Automotriz Integral</small></div></header>
<main class="wrap">
<div class="top">
<section class="card">
<h2>Nueva agenda</h2>
<form id="form">
<label>Nombre</label><input id="name" required autocomplete="name" placeholder="Nombre del cliente">
<div class="row"><div><label>Patente</label><input id="plate" required maxlength="10" placeholder="ABCD12"></div><div><label>Teléfono</label><input id="phone" type="tel" placeholder="+56 9 ..."></div></div>
<label>Fecha</label><input id="date" type="date" required>
<label>Hora</label><div id="hours" class="hours"></div><input id="time" type="hidden" required>
<label>Observación / trabajo a realizar</label><textarea id="note" required placeholder="Ej.: Mantención 80.000 km, revisión de frenos..."></textarea>
<button class="primary" type="submit" id="saveBtn">GUARDAR AGENDA</button>
</form>
</section>
<section class="card">
<div class="datebar"><h2 style="margin-right:auto">Agenda del día</h2><input id="viewDate" type="date"></div>
<div class="stats"><div class="stat"><b id="count">0</b>Agendados</div><div class="stat"><b id="free">40</b>Cupos libres</div><div class="stat"><b id="full">0</b>Horas completas</div></div>
<div id="list"></div>
</section>
</div>
</main>
<script>
const KEY='geolub_agenda_app_v1';
const TIMES=['09:00','10:00','11:00','12:00','13:00','14:00','15:00','16:00','17:00','18:00'];
const $=s=>document.querySelector(s);
let editId=null;
const today=()=>{const d=new Date();const z=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`};
function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch{return []}}
function save(a){localStorage.setItem(KEY,JSON.stringify(a))}
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function used(date,time,ignore=null){return load().filter(x=>x.date===date&&x.time===time&&x.id!==ignore).length}
function renderHours(){
 const date=$('#date').value; const selected=$('#time').value; const box=$('#hours'); box.innerHTML='';
 TIMES.forEach(t=>{const n=used(date,t,editId), left=4-n; const b=document.createElement('button');b.type='button';b.className='hour'+(selected===t?' sel':'')+(left<=0?' full':'');b.disabled=left<=0&&selected!==t;b.innerHTML=`<b>${t}</b><span>${left<=0?'COMPLETO':left+' cupo'+(left===1?'':'s')+' libre'+(left===1?'':'s')}</span>`;b.onclick=()=>{$('#time').value=t;renderHours()};box.appendChild(b)})
}
function render(){
 const date=$('#viewDate').value, a=load().filter(x=>x.date===date).sort((a,b)=>a.time.localeCompare(b.time)||a.created-b.created);
 $('#count').textContent=a.length; $('#free').textContent=40-a.length; $('#full').textContent=TIMES.filter(t=>used(date,t)>=4).length;
 const list=$('#list'); if(!a.length){list.innerHTML='<div class="empty">No hay vehículos agendados para esta fecha.</div>';return}
 list.innerHTML=a.map(x=>`<div class="item"><div class="time">${esc(x.time)}<br><span class="badge">${used(date,x.time)}/4</span></div><div><strong>${esc(x.name)} · ${esc(x.plate)}</strong><div class="meta">${esc(x.phone||'Sin teléfono')}</div><div>${esc(x.note)}</div></div><div class="actions"><button onclick="editAppt('${x.id}')">Editar</button><button class="del" onclick="delAppt('${x.id}')">Eliminar</button></div></div>`).join('');
}
function resetForm(){editId=null;$('#form').reset();$('#date').value=$('#viewDate').value||today();$('#time').value='';$('#saveBtn').textContent='GUARDAR AGENDA';renderHours()}
window.editAppt=id=>{const x=load().find(v=>v.id===id);if(!x)return;editId=id;$('#name').value=x.name;$('#plate').value=x.plate;$('#phone').value=x.phone;$('#date').value=x.date;$('#time').value=x.time;$('#note').value=x.note;$('#saveBtn').textContent='GUARDAR CAMBIOS';renderHours();scrollTo({top:0,behavior:'smooth'})}
window.delAppt=id=>{if(!confirm('¿Eliminar esta agenda?'))return;save(load().filter(x=>x.id!==id));render();renderHours()}
$('#form').onsubmit=e=>{e.preventDefault();const date=$('#date').value,time=$('#time').value;if(!time)return alert('Selecciona una hora.');if(used(date,time,editId)>=4)return alert('Esa hora ya tiene los 4 cupos ocupados.');let a=load();const obj={id:editId||crypto.randomUUID(),name:$('#name').value.trim(),plate:$('#plate').value.trim().toUpperCase(),phone:$('#phone').value.trim(),date,time,note:$('#note').value.trim(),created:Date.now()};if(editId)a=a.map(x=>x.id===editId?{...x,...obj}:x);else a.push(obj);save(a);$('#viewDate').value=date;resetForm();render();alert('Agenda guardada correctamente.')}
$('#date').onchange=()=>{$('#time').value='';renderHours()};$('#viewDate').onchange=render;
$('#viewDate').value=today();$('#date').value=today();renderHours();render();
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');
</script>
</body></html>
