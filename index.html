<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071f46">
<title>GEOLUB Agenda</title>
<link rel="manifest" href="./manifest.json">

<style>
:root{
  --navy:#071f46;
  --navy2:#0b376f;
  --blue:#2C2B7E;
  --red:#d71920;
  --red2:#9A1B1E;
  --ink:#132342;
  --bg:#eef3f9;
  --line:#d6deea;
  --green:#13a66a;
  --sky:#62bce8;
  --orange:#f2a000;
}
*{box-sizing:border-box}
html,body{
  margin:0;
  min-height:100%;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  background:var(--bg);
  color:var(--ink);
}
button,input,textarea{font:inherit}

/* CABECERA */
.hero{
  min-height:230px;
  background:
    linear-gradient(90deg,rgba(4,28,64,.96),rgba(5,38,81,.88)),
    url("./taller-elevadora.jpg") center/cover no-repeat;
  color:#fff;
  display:grid;
  grid-template-columns:300px 1fr 260px;
  align-items:center;
  gap:25px;
  padding:25px 34px;
  border-bottom:4px solid #fff;
  box-shadow:0 5px 20px #0003;
}
.brandBox{
  background:#fff;
  border-radius:24px;
  padding:12px;
  text-align:center;
  box-shadow:0 10px 30px #0005;
}
.brandBox img{
  display:block;
  width:100%;
  height:125px;
  object-fit:contain;
}
.brandAgenda{
  background:linear-gradient(#ed1821,#b7070e);
  color:white;
  font-size:26px;
  font-weight:950;
  padding:8px;
  border-radius:11px;
  margin-top:7px;
  letter-spacing:.03em;
}
.heroCenter{text-align:center}
.heroCenter h1{
  margin:0;
  font-size:clamp(29px,4vw,48px);
  line-height:1.05;
  font-weight:950;
  text-shadow:0 4px 10px #0008;
}
.heroCenter p{
  margin:13px 0 0;
  font-weight:700;
}
.userBox{
  border:2px solid #1474bb;
  border-radius:22px;
  padding:18px;
  background:#062653dd;
  min-height:150px;
  display:flex;
  flex-direction:column;
  justify-content:center;
}
.userDate,.userTime{
  font-size:15px;
  font-weight:800;
  margin-bottom:10px;
}
.userName{
  font-size:20px;
  font-weight:950;
}
.userRole{
  font-size:14px;
  margin-left:27px;
}

/* MENU */
.nav{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  background:#fff;
  box-shadow:0 5px 15px #25365b22;
  position:sticky;
  top:0;
  z-index:20;
}
.nav button{
  border:0;
  border-right:1px solid #d6deea;
  background:white;
  color:#12284c;
  padding:16px 8px;
  font-weight:900;
  cursor:pointer;
  min-height:88px;
  font-size:15px;
}
.nav button span{
  display:block;
  font-size:25px;
  margin-bottom:5px;
}
.nav button.active{
  color:white;
  background:linear-gradient(135deg,#ed101a,#bd0710);
}

/* CONTENIDO */
.wrap{
  max-width:1500px;
  margin:auto;
  padding:20px;
}
.screen{display:none}
.screen.active{display:block}
.dashboard{
  display:grid;
  grid-template-columns:420px 1fr;
  gap:18px;
}
.card{
  background:white;
  border:1px solid var(--line);
  border-radius:20px;
  overflow:hidden;
  box-shadow:0 10px 30px #243a6412;
}
.cardBody{padding:20px}
.cardTitle{
  margin:0;
  padding:16px 20px;
  color:#fff;
  font-size:25px;
  font-weight:950;
  background:linear-gradient(110deg,#e20d17,#a70d26 40%,#073d7b);
}
.cardTitle.blue{
  background:#fff;
  color:#13284c;
  border-bottom:1px solid var(--line);
}

/* FORMULARIO */
label{
  display:block;
  font-size:14px;
  font-weight:900;
  margin:13px 0 6px;
}
input,textarea{
  width:100%;
  border:1px solid #cbd5e3;
  border-radius:12px;
  padding:13px 14px;
  background:#fff;
  color:#17213b;
  outline:none;
}
textarea{
  min-height:90px;
  resize:vertical;
}
.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}
.hours{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:7px;
  margin-top:8px;
}
.hour{
  border:2px solid transparent;
  border-radius:11px;
  padding:10px 4px;
  background:#eef3f9;
  color:#153469;
  cursor:pointer;
  font-weight:900;
}
.hour b{display:block}
.hour small{font-size:10px}
.hour.sel{
  border-color:#e11922;
  background:#fff0f1;
  color:#a60c14;
}
.hour.full{opacity:.5}
.saveBtn{
  width:100%;
  margin-top:16px;
  border:0;
  border-radius:11px;
  padding:14px;
  background:linear-gradient(#e31a23,#b90911);
  color:#fff;
  font-weight:950;
  cursor:pointer;
}

/* AGENDA */
.dayHeader{
  display:flex;
  align-items:center;
  gap:15px;
  padding:15px 18px 5px;
}
.dayHeader h2{
  margin:0 auto 0 0;
  color:#13284c;
  font-size:27px;
}
.dayHeader input{width:190px}
.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  padding:12px 18px 16px;
}
.stat{
  text-align:center;
  border-radius:15px;
  padding:12px 8px;
}
.stat b{
  display:block;
  font-size:26px;
}
.stat:nth-child(1){background:#eaf4ff;color:#1473c7}
.stat:nth-child(2){background:#eaf9f1;color:#11945b}
.stat:nth-child(3){background:#fff6df;color:#d88b00}
.stat:nth-child(4){background:#fff0f1;color:#d51b29}

.tableWrap{
  padding:0 18px 18px;
  overflow:auto;
}
.schedule{
  min-width:830px;
  display:grid;
  grid-template-columns:90px repeat(4,minmax(165px,1fr));
  gap:5px;
}
.th{
  background:#073f7e;
  color:white;
  text-align:center;
  padding:12px 6px;
  font-weight:950;
  border-radius:6px;
}
.timeCell{
  background:#eef3f9;
  border-radius:8px;
  min-height:80px;
  display:flex;
  justify-content:center;
  align-items:center;
  font-weight:950;
  color:#153469;
}
.slot{
  min-height:80px;
  border:1px solid #e0e6ef;
  background:#f9fbfd;
  border-radius:8px;
  padding:8px;
}
.slot.emptySlot{
  display:flex;
  align-items:center;
  justify-content:center;
  color:#abb5c3;
  font-size:24px;
}
.slot.busy{
  background:#eaf5ff;
  border-left:5px solid #57b7e5;
}
.slot.attended{
  background:#eaf9f1;
  border-left:5px solid var(--green);
}
.slot strong{
  display:block;
  font-size:13px;
}
.slot small{
  display:block;
  margin-top:3px;
}
.slotBtns{
  display:flex;
  gap:4px;
  margin-top:7px;
}
.slotBtns button{
  border:0;
  border-radius:6px;
  padding:5px 7px;
  font-size:11px;
  font-weight:800;
  cursor:pointer;
}
.okBtn{background:#dff5e9;color:#087848}
.editBtn{background:#e6effa;color:#164c83}
.delBtn{background:#fde5e7;color:#a00c16}

.simpleList{padding:18px}
.listItem{
  background:#fff;
  border:1px solid var(--line);
  border-left:5px solid var(--navy2);
  padding:14px;
  margin-bottom:10px;
  border-radius:12px;
}
.listItem strong{font-size:16px}
.empty{
  padding:40px;
  text-align:center;
  color:#778398;
}

.searchBox{
  max-width:700px;
  margin:auto;
}
.searchResults{margin-top:15px}

@media(max-width:900px){
  .hero{
    grid-template-columns:210px 1fr;
    padding:18px;
  }
  .userBox{
    grid-column:1/-1;
    min-height:auto;
  }
  .dashboard{grid-template-columns:1fr}
  .nav{
    grid-template-columns:repeat(3,1fr);
  }
}

@media(max-width:600px){
  .hero{
    grid-template-columns:1fr;
    text-align:center;
  }
  .brandBox{
    max-width:280px;
    margin:auto;
  }
  .userBox{display:none}
  .nav{
    grid-template-columns:repeat(2,1fr);
  }
  .row{grid-template-columns:1fr}
  .hours{grid-template-columns:repeat(2,1fr)}
  .stats{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>

<body>

<header class="hero">
  <img src="./geolub-agenda-banner.png" alt="GEOLUB Agenda" style="width:100%;height:auto;display:block;">
</header>

<nav class="nav">
  <button class="active" data-screen="new">
    <span>🗓️</span>Nueva Agenda
  </button>
  <button data-screen="day">
    <span>📅</span>Agenda del Día
  </button>
  <button data-screen="week">
    <span>🗓️</span>Agenda Semanal
  </button>
  <button data-screen="pending">
    <span>🕐</span>Pendientes
  </button>
  <button data-screen="attended">
    <span>✔</span>Atendidos
  </button>
  <button data-screen="search">
    <span>🔎</span>Buscar
  </button>
</nav>

<main class="wrap">

<section id="new" class="screen active">
<div class="dashboard">

<div class="card">
<h2 class="cardTitle">🗓️ Nueva Agenda</h2>

<div class="cardBody">
<form id="form">

<label>Nombre del cliente *</label>
<input id="name" required placeholder="Ingrese nombre del cliente">

<div class="row">
<div>
<label>Patente *</label>
<input id="plate" required maxlength="10" placeholder="Ej: ABCD12">
</div>

<div>
<label>Teléfono *</label>
<input id="phone" type="tel" required placeholder="Ej: +56 9 1234 5678">
</div>
</div>

<label>Fecha *</label>
<input id="date" type="date" required>

<label>Hora *</label>
<div id="hours" class="hours"></div>
<input id="time" type="hidden">

<label>Trabajo / Mantención a realizar *</label>
<textarea id="note" required
placeholder="Ej: Mantención 80.000 km, cambio de aceite, revisión de frenos..."></textarea>

<button class="saveBtn" id="saveBtn" type="submit">
GUARDAR AGENDA
</button>

</form>
</div>
</div>

<div class="card">

<div class="dayHeader">
<h2>📅 Agenda del Día</h2>
<input id="viewDate" type="date">
</div>

<div class="stats">
<div class="stat">
<b id="count">0</b>
Agendados hoy
</div>

<div class="stat">
<b id="free">40</b>
Cupos disponibles
</div>

<div class="stat">
<b id="pendingCount">0</b>
Pendientes
</div>

<div class="stat">
